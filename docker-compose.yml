# Sobe tudo com:  docker compose up --build
#   Front-end: http://localhost:3000
#   API/docs:  http://localhost:8000/docs
services:
  back:
    build: ./back
    ports:
      - "8000:8000"
    environment:
      # 4 barras = caminho absoluto dentro do container
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      # O arquivo do banco fica neste volume e sobrevive a "docker compose down"
      - db_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  front:
    build: ./front
    ports:
      - "3000:80"
    depends_on:
      back:
        condition: service_healthy # só sobe o front depois que a API responde
    restart: unless-stopped

volumes:
  db_data:
